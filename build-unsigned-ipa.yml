name: Build unsigned iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -project OGIOSSafe.xcodeproj -scheme OGIOSSafe -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OGIOSSafe.app Payload/
          /usr/bin/zip -r OGIOSSafe-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OGIOSSafe-unsigned-IPA
          path: OGIOSSafe-unsigned.ipa
